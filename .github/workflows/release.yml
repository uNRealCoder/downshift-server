name: Release

# The publication of a GitHub Release starts this job. The tag of that release must match the
# version in pyproject.toml. The tests must pass on it. Only then do the sdist and the wheel go
# to PyPI. workflow_dispatch runs only the build gates and the test gates. It publishes nothing.

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install build twine

      # A release with the tag v0.1.9 that ships 0.2.0 cannot be repaired. PyPI never accepts
      # a second upload of a version. Fail here and not after the upload.
      - name: Check tag matches pyproject version
        if: github.event_name == 'release'
        run: |
          project_version=$(python -c "import tomllib,pathlib; print(tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project']['version'])")
          tag_version="${GITHUB_REF_NAME#v}"
          echo "pyproject: $project_version / tag: $tag_version"
          if [ "$project_version" != "$tag_version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match pyproject.toml version $project_version"
            exit 1
          fi

      - run: python -m build
      - run: twine check --strict dist/*

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  # The test matrix, the floor job and the Windows job of ci.yml. They enforce the 95% coverage.
  ci:
    uses: ./.github/workflows/ci.yml

  # Install the built wheel, not the checkout, into a clean venv with only the CPU torch. This
  # finds a wheel that misses a file or that imports torch at import time.
  smoke-wheel:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Install the wheel in a clean venv
        run: |
          python -m venv "$RUNNER_TEMP/smoke"
          "$RUNNER_TEMP/smoke/bin/pip" install torch --index-url https://download.pytorch.org/whl/cpu
          "$RUNNER_TEMP/smoke/bin/pip" install dist/*.whl
      - name: Run the commands
        # The checkout has no src/downshift on the path. Python imports downshift from the venv.
        # The "examples" package comes from the current directory (the checkout).
        run: |
          export PATH="$RUNNER_TEMP/smoke/bin:$PATH"
          downshift --version
          downshift --help
          python -c "import downshift, sys; assert 'torch' not in sys.modules"
          python -c "import downshift; assert 'site-packages' in downshift.__file__, downshift.__file__"
          downshift check examples.clean_mlp:make_model

  publish-pypi:
    if: github.event_name == 'release'
    needs: [build, ci, smoke-wheel]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/downshift-server
    permissions:
      id-token: write  # OIDC token for PyPI trusted publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  attach-to-release:
    if: github.event_name == 'release'
    needs: publish-pypi
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Upload sdist and wheel to the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" dist/* --clobber --repo "$GITHUB_REPOSITORY"