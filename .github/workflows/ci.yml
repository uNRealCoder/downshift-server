name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_call:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: pip install -e ".[dev,gnn,hf,fast]"
      # The HTTPS tests make a throwaway certificate with the openssl command (tests/conftest.py).
      # The runner images have it. The install is only a fallback.
      - name: openssl
        run: command -v openssl || (sudo apt-get update && sudo apt-get install -y openssl); openssl version
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy src
      - run: pytest -q --cov=src/downshift --cov-report=term-missing --cov-fail-under=95

  floor:
    # This job pins the oldest torch that downshift supports (2.8), the oldest onnxruntime (1.20:
    # torch 2.8 writes IR version 10 graphs and ArgMax for last-token pooling needs a CPU kernel),
    # the oldest onnxscript, transformers at its floor (5.17.0), and the oldest web and CLI
    # libraries. Downshift uses only the dynamo exporter (torch.onnx.export(dynamo=True)), so the
    # onnx package has no old-version limit: the job uses the latest stable onnx.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install "torch==2.8.0" --index-url https://download.pytorch.org/whl/cpu
      # onnx-ir 0.1.16 and later broke the exporter of torch 2.6: its version converter said "The
      # model contains functions" and every export was FAILED. 0.1.15 is the newest that worked
      # there. The pin keeps the floor job the same on each run.
      # One pip command for all pins, so that pip resolves them together. typer 0.12 to 0.14 were
      # three packages (typer, typer-slim, typer-cli) that share one folder. If pip installs them
      # on top of a newer typer, its uninstall step deletes the new files, and `import typer` fails.
      # That is why the typer floor is 0.15, the first release of one package again.
      - run: >-
          pip install "onnx==1.23.2" "onnxruntime==1.20.1" "onnxscript==0.5.0" "onnx-ir<0.1.16"
          "numpy==2.0.2" "transformers==5.17.0" "typer==0.15.4" "fastapi==0.115.0"
          "uvicorn[standard]==0.30.0" "pydantic==2.5.0" "orjson==3.9.7" "torch-geometric==2.5.0"
      - run: pip install -e ".[dev,gnn,hf,fast]"
      # The HTTPS tests make a throwaway certificate with the openssl command (tests/conftest.py).
      # The runner images have it. The install is only a fallback.
      - name: openssl
        run: command -v openssl || (sudo apt-get update && sudo apt-get install -y openssl); openssl version
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy src
      - run: pytest -q

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: pip install -e ".[dev,gnn,hf,fast]"
      # The HTTPS tests make a throwaway certificate with the openssl command (tests/conftest.py).
      # The runner image has it. The install is only a fallback.
      - name: openssl
        shell: bash
        run: command -v openssl || choco install openssl -y --no-progress; openssl version
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy src
      - run: pytest -q --cov=src/downshift --cov-report=term-missing --cov-fail-under=95
