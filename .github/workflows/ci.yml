name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: pip install -e ".[dev,gnn,hf,fast]"
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy src
      - run: pytest -q --cov=src/downshift --cov-report=term-missing --cov-fail-under=95

  floor:
    # Pins the oldest torch the dynamo exporter supports (report= on torch.onnx.export is a
    # 2.5 feature) plus the oldest onnx/onnxruntime/onnxscript verified locally to actually
    # export+run against it: onnx 1.14 (the previous floor) fails to even install alongside
    # onnxscript's own onnx>=1.16 requirement, and onnxscript below 0.5 hits a real bug in
    # torch 2.5's type-promotion pass on plain dynamic-batch Conv2d - neither is specific to
    # this project's code. onnxruntime 1.17 needs numpy<2 for its ABI.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install "torch==2.5.1" --index-url https://download.pytorch.org/whl/cpu
      - run: pip install "onnx==1.16.0" "onnxruntime==1.17.0" "onnxscript==0.5.0" "numpy<2" "prometheus_client==0.17.*"
      - run: pip install -e ".[dev,gnn,hf,fast]"
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy src
      - name: pytest
        # Even at the newest transformers/torch-geometric releases compatible with these
        # pins, torch 2.5.1's dynamo tracer can't export a from-scratch BertModel with a
        # dynamic sequence axis, or a few PyG message-passing patterns (ConstraintViolationError /
        # "Unsupported: call_method" from torch itself, not from this project's code, and not
        # fixed by any onnx/onnxruntime/onnxscript combination tried). Those tests carry
        # `@pytest.mark.needs_torch_26`; conftest.py skips them here based on torch.__version__
        # until the floor moves past 2.5.x. Every other test, including the rest of the hf and
        # gnn suites, runs and passes.
        run: pytest -q

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: pip install -e ".[dev,gnn,hf,fast]"
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy src
      - run: pytest -q --cov=src/downshift --cov-report=term-missing --cov-fail-under=95
