name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: pip install -e ".[dev,gnn,hf,fast]"
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy src
      - run: pytest -q --cov=src/downshift --cov-report=term-missing --cov-fail-under=95

  floor:
    # This job pins the oldest torch that the dynamo exporter supports (report= on
    # torch.onnx.export is a feature of 2.5). It also pins the oldest onnx, onnxruntime and
    # onnxscript that we verified locally for export and run with it. onnx 1.14 (the previous
    # floor) does not install together with the requirement onnx>=1.16 of onnxscript. onnxscript
    # below 0.5 has a real bug in the type-promotion pass of torch 2.5 on a plain Conv2d with a
    # dynamic batch. Neither fault is specific to the code of this project. onnxruntime 1.17
    # needs numpy<2 for its ABI.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install "torch==2.5.1" --index-url https://download.pytorch.org/whl/cpu
      # transformers 5.19 calls torch.accelerator (torch 2.6 and later) on import. 5.17.0 is the
      # last release with which this job passed.
      - run: pip install "onnx==1.16.0" "onnxruntime==1.17.0" "onnxscript==0.5.0" "numpy<2" "transformers==5.17.0"
      - run: pip install -e ".[dev,gnn,hf,fast]"
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy src
      - name: pytest
        # The newest releases of transformers and torch-geometric that are compatible with these
        # pins do not change this. The dynamo tracer of torch 2.5.1 cannot export a BertModel
        # that is built from scratch with a dynamic sequence axis. It also cannot export a few
        # PyG message-passing patterns (ConstraintViolationError or "Unsupported: call_method"
        # from torch itself). These errors do not come from the code of this project, and no
        # combination of onnx, onnxruntime and onnxscript that we tried fixes them. These tests
        # have `@pytest.mark.needs_torch_26`. conftest.py skips them here, based on
        # torch.__version__, until the floor moves above 2.5.x. All other tests run and pass,
        # including the rest of the hf and gnn suites.
        run: pytest -q

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: pip install -e ".[dev,gnn,hf,fast]"
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy src
      - run: pytest -q --cov=src/downshift --cov-report=term-missing --cov-fail-under=95
