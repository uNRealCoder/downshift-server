[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "downshift-server"
version = "0.5.0"
description = "Serve PyTorch models over HTTP through ONNX Runtime, verified against PyTorch before serving, with eager fallback."
readme = "README.md"
requires-python = ">=3.12,<3.15"
license = {text = "MIT"}
authors = [
    {name = "Nikhil Ranjan", email = "nrnikhilranjan1997@gmail.com"}
]
keywords = ["onnx", "pytorch", "model-serving", "export"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
]

dependencies = [
    "torch>=2.5",  # torch.onnx.export(dynamo=True) accepting an ExportedProgram with report= is 2.5+
    "onnx>=1.16",  # onnxscript's own floor; older onnx also hits real bugs in torch 2.5's exporter
    "onnxruntime>=1.17",
    "onnxscript>=0.5",  # 0.1-0.4 fail to translate ops torch 2.5's exporter emits for dynamic shapes
    "typer>=0.12",
    "fastapi>=0.100",
    "uvicorn[standard]>=0.23",
    "numpy>=1.24",
    "pydantic>=2.0",
    "orjson>=3.9",
    "prometheus_client>=0.17",  # /metrics; pure Python, always on
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.0",
    "httpx>=0.24",  # FastAPI TestClient
    "safetensors>=0.4",  # reference reader/writer for the binary wire format tests
]
gnn = [
    "torch-geometric>=2.5",
]
hf = [
    "transformers>=4.40",
]
fast = [
    "pybase64>=1.4",  # SIMD base64 for binary tensor I/O; stdlib is used when absent
]
all = [
    "downshift-server[gnn,hf,fast]",
]

[project.urls]
Homepage = "https://github.com/uNRealCoder/downshift-server"
Repository = "https://github.com/uNRealCoder/downshift-server"
Changelog = "https://github.com/uNRealCoder/downshift-server/blob/main/CHANGELOG.md"
Issues = "https://github.com/uNRealCoder/downshift-server/issues"

[project.scripts]
downshift = "downshift.cli.main:app"

# The built-in adapters (generic, pyg, hf) are not entry points: downshift.adapters.registry
# imports them directly, gated on sys.modules, so discovering adapters never imports
# transformers or torch_geometric on their behalf. Third-party adapters still register here.

[tool.hatch.build.targets.wheel]
packages = ["src/downshift"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = [
    "E501",  # line too long — will auto-format in later passes
    "B008",  # typer's API requires call-in-default for Option()/Argument()
]

[tool.ruff.lint.isort]
known-first-party = ["downshift"]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
addopts = ["--cov=src/downshift", "--cov-report=term-missing"]
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
markers = [
    "needs_torch_26: requires torch >= 2.6 (skipped on the CI floor job, pinned to 2.5.1)",
]

[tool.coverage.run]
source = ["src/downshift"]

[tool.coverage.report]
show_missing = true
