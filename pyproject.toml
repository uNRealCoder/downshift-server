[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "downshift-server"
version = "1.0.0rc1"
description = "Serve PyTorch models over HTTP through ONNX Runtime. Downshift verifies each export against PyTorch before it serves, and it falls back to eager PyTorch."
readme = "README.md"
requires-python = ">=3.12,<3.15"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    {name = "Nikhil Ranjan", email = "nrnikhilranjan1997@gmail.com"}
]
keywords = ["onnx", "pytorch", "model-serving", "export"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
]

dependencies = [
    "torch>=2.8",  # CI tests the floor on 2.8; torch 2.6 and 2.7 cannot export a Hugging Face encoder up to its position limit
    "onnx>=1.23",  # the floor job tests the latest stable onnx; only the dynamo exporter is used, so no legacy exporter limits it
    "onnxruntime>=1.20",  # torch 2.8 writes IR version 10 graphs (ORT 1.17 reads up to 9); ORT 1.18 has no CPU kernel for ArgMax(13), which last-token pooling needs
    "onnxscript>=0.5",  # 0.1-0.4 fail to translate ops that the torch exporter emits for dynamic shapes
    "typer>=0.12",
    "fastapi>=0.100",
    "uvicorn[standard]>=0.23",
    "numpy>=1.24",
    "pydantic>=2.0",
    "orjson>=3.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=5.0",
    "ruff==0.17.0",  # pinned: CI and local runs must format the same way (0.17 also formats Markdown code blocks)
    "mypy>=1.0",
    "httpx>=0.24",  # FastAPI TestClient
    "safetensors>=0.4",  # reference reader/writer for the binary wire format tests
    "prometheus-client>=0.20",  # parses the /metrics text in the tests
    "openai>=1.40",  # the client tests of the /v1 routes
]
gnn = [
    "torch-geometric>=2.5",
]
hf = [
    "transformers>=5.17",
]
fast = [
    "pybase64>=1.4",  # SIMD base64 for binary tensor I/O; stdlib is used when absent
]
all = [
    "downshift-server[gnn,hf,fast]",
]

[project.urls]
Homepage = "https://github.com/uNRealCoder/downshift-server"
Repository = "https://github.com/uNRealCoder/downshift-server"
Changelog = "https://github.com/uNRealCoder/downshift-server/blob/main/CHANGELOG.md"
Issues = "https://github.com/uNRealCoder/downshift-server/issues"

[project.scripts]
downshift = "downshift.cli.entry:main"

# The built-in adapters (generic, pyg, hf) are not entry points. downshift.adapters.registry
# imports them directly, and it uses sys.modules as a gate. The search for adapters therefore
# never imports transformers or torch_geometric for them. Third-party adapters still register
# here.

[tool.hatch.build.targets.wheel]
packages = ["src/downshift"]

[tool.hatch.build.targets.sdist]
include = ["/src", "/tests", "/docs", "/examples", "/scripts/gen_matrix.py", "/README.md", "/LICENSE", "/CHANGELOG.md", "/llms.txt"]
exclude = ["**/__pycache__", "**/*.pyc"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = [
    "E501",  # line too long — will auto-format in later passes
    "B008",  # typer's API requires call-in-default for Option()/Argument()
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E402"]  # imports after pytest.importorskip

[tool.ruff.lint.isort]
known-first-party = ["downshift"]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"

[tool.coverage.run]
source = ["src/downshift"]

[tool.coverage.report]
show_missing = true
