[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "downshift-server"
version = "0.1.0"
description = "Universal PyTorch → ONNX verification and serving, with graceful fallback."
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = {text = "MIT"}
authors = [
    {name = "Nikhil Ranjan", email = "nrnikhilranjan1997@gmail.com"}
]
keywords = ["onnx", "pytorch", "model-serving", "export"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

dependencies = [
    "torch>=2.0",
    "onnx>=1.14",
    "onnxruntime>=1.17",
    "onnxscript>=0.1",  # required by torch.onnx.export(dynamo=True)
    "typer[all]>=0.12",
    "rich>=13.0",
    "fastapi>=0.100",
    "uvicorn[standard]>=0.23",
    "numpy>=1.24",
    "pydantic>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "ruff>=0.6",
    "mypy>=1.0",
]
gnn = [
    "torch-geometric>=2.5",
]

[project.scripts]
downshift = "downshift.cli.main:app"

[tool.hatch.build.targets.wheel]
packages = ["src/downshift"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = ["E501"]  # line too long — will auto-format in later passes

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
